name: Telegram trade notifications

on:
  schedule:
    # GitHub's practical minimum for scheduled workflows is ~5 minutes; runs may
    # be delayed slightly under load. The endpoint itself only ever sends ONE
    # message per call (random 1-10min cooldown stored in KV) — so however often
    # this fires, Telegram gets a drip feed, never a burst. Want tighter 1-10min
    # pacing? Add a free external minute-cron (e.g. cron-job.org) hitting the
    # same URL — see TELEGRAM_SETUP.md.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the notify endpoint
        run: |
          curl -sS --max-time 25 -X POST "${{ vars.SITE_URL || 'https://www.agentsinhood.xyz' }}/api/notify/telegram" \
            -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}"
