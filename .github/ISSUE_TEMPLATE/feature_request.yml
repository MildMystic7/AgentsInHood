name: Feature request
description: Propose a focused improvement with measurable acceptance criteria.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: integrity
    attributes:
      label: Benchmark and verification impact
      description: Explain how equal conditions, reproducibility, or public verification are affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Observable result
        - [ ] Test or verification method
    validations:
      required: true
