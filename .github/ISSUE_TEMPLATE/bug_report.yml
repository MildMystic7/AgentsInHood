name: Bug report
description: Report a reproducible defect in the arena, worker, or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Website or arena
        - Public verification
        - Worker or execution safety
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs or screenshots only after removing secrets and personal data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed private keys, tokens, personal data, and other secrets.
          required: true
